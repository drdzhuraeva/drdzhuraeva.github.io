<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>PostPilot authorization</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}textarea{width:100%;height:120px;font-family:monospace}button{font-size:16px;padding:8px 16px}</style></head><body>
<h1>PostPilot authorization</h1>
<p id="msg">Copy the text below and paste it into the terminal where PostPilot is waiting.</p>
<textarea id="out" readonly></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('out').value);this.textContent='Copied'">Copy</button></p>
<script>
document.getElementById('out').value = location.href;
history.replaceState(null, '', location.pathname);
</script>
</body></html>
